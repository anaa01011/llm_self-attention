# Scaling Configuration for Deep Reasoning LLM
# Use these presets to easily scale your model to different sizes

# Small model (~110M parameters) - Base configuration
small:
  model:
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 12
    intermediate_size: 3072
    vocab_size: 50000
    max_position_embeddings: 512

# Medium model (~350M parameters)
medium:
  model:
    hidden_size: 1024
    num_hidden_layers: 24
    num_attention_heads: 16
    intermediate_size: 4096
    vocab_size: 50000
    max_position_embeddings: 1024

# Large model (~760M parameters)
large:
  model:
    hidden_size: 1536
    num_hidden_layers: 24
    num_attention_heads: 16
    intermediate_size: 6144
    vocab_size: 50000
    max_position_embeddings: 2048

# XLarge model (~1.3B parameters)
xlarge:
  model:
    hidden_size: 2048
    num_hidden_layers: 24
    num_attention_heads: 32
    intermediate_size: 8192
    vocab_size: 50000
    max_position_embeddings: 2048

# XXLarge model (~2.7B parameters)
xxlarge:
  model:
    hidden_size: 2560
    num_hidden_layers: 32
    num_attention_heads: 32
    intermediate_size: 10240
    vocab_size: 50000
    max_position_embeddings: 4096

# Notes on scaling:
# 1. hidden_size should be divisible by num_attention_heads
# 2. intermediate_size is typically 4x hidden_size
# 3. Longer context (max_position_embeddings) requires more memory
# 4. Training config should be adjusted based on model size:
#    - Larger models: smaller batch size, lower learning rate
#    - Smaller models: larger batch size, higher learning rate

# Training adjustments by size:
training_adjustments:
  small:
    batch_size: 32
    learning_rate: 3.0e-4
    warmup_steps: 2000
    
  medium:
    batch_size: 16
    learning_rate: 2.0e-4
    warmup_steps: 4000
    
  large:
    batch_size: 8
    learning_rate: 1.5e-4
    warmup_steps: 8000
    
  xlarge:
    batch_size: 4
    learning_rate: 1.0e-4
    warmup_steps: 10000
    gradient_accumulation_steps: 8
    
  xxlarge:
    batch_size: 2
    learning_rate: 8.0e-5
    warmup_steps: 15000
    gradient_accumulation_steps: 16
